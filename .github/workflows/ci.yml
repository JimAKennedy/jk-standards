name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same PR/branch to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: python -m pytest tests/

  # Coverage runs on one Python version only — the goal is a gate, not a matrix.
  # 80% floor is a bug-fix ratchet: raise it when the number drifts up, never
  # accept a PR that drops it. Threshold is enforced by coverage.py's own
  # `fail_under`, not a shell arithmetic hack.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run pytest with coverage
        run: |
          coverage run -m pytest tests/
          coverage report
          coverage xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
          if-no-files-found: warn

  # Dogfood the shipped pre-commit hooks against this repo. If a hook regresses
  # here it would break every downstream consumer, so this gate is required.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - name: Cache pre-commit environments
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.pre-commit-config.local.yaml') }}
      - run: pre-commit run --all-files --show-diff-on-failure
      # Self-referential hooks live in a separate config that pre-commit.ci
      # cannot load (repo: . fails there). GHA runs them explicitly here.
      - run: pre-commit run --config .pre-commit-config.local.yaml --all-files --show-diff-on-failure

  # The toolkit gates itself with itself: its docs carry class front-matter,
  # its drift map pairs the check sources with the doc that describes them,
  # and its behavioral claims cite its own pytest suite.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # `[dev]` because generated-freshness gates coverage.json here, which
      # emit_coverage regenerates via pytest+coverage. Downstream repos take
      # the graceful fallback path (see emit.py:emit_coverage).
      - run: pip install -e ".[dev]"
      - run: jk-standards all

  # Verify the distributable artifacts build cleanly and pass twine's metadata
  # linter. Catches broken pyproject metadata / missing README before the tag
  # is cut, not after PyPI rejects the upload.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dist
          path: dist/
          retention-days: 14

  # Smoke-test the reusable doc-discipline workflow by consuming it here,
  # pointed at this same commit. If the reusable workflow's shape breaks,
  # downstream consumers break — this catches it before a tag ships.
  reusable-workflow-smoke:
    uses: ./.github/workflows/doc-discipline.yml
    with:
      toolkit-ref: ${{ github.sha }}
      config: jk-standards.yaml
      python-version: "3.12"

  # Build the Starlight site. Fails the PR if any MDX doc is broken, a
  # CodeSnippet region marker is missing, or an internal link is invalid.
  # The site's prebuild hook runs `jk-standards emit all`, so the Python
  # package (with [dev] extras for coverage.py) must be installed first;
  # `emit coverage` invokes pytest when .coverage isn't already on disk.
  # The published site is deployed by a separate workflow on push to main.
  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: site-dist
          path: site/dist/
          retention-days: 14
          if-no-files-found: error

  # Secret scanning. Gitleaks needs full history for effective coverage;
  # pull_request events already default to the merge commit — fetch-depth: 0
  # ensures the branch history is present.
  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Single check for branch protection to require. If any dependency job
  # fails, skips, or is cancelled, this fails — no advisory-pass loophole.
  ci-complete:
    needs: [test, coverage, pre-commit, dogfood, package, reusable-workflow-smoke, secrets-scan, site-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.coverage.result }}" != "success" ]] || \
             [[ "${{ needs.pre-commit.result }}" != "success" ]] || \
             [[ "${{ needs.dogfood.result }}" != "success" ]] || \
             [[ "${{ needs.package.result }}" != "success" ]] || \
             [[ "${{ needs.reusable-workflow-smoke.result }}" != "success" ]] || \
             [[ "${{ needs.secrets-scan.result }}" != "success" ]] || \
             [[ "${{ needs.site-build.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same PR/branch to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This workflow dogfoods several reusable workflows via `uses: ./…`. A reusable
# workflow cannot be granted more than the CALLER's top-level token scope, so
# every permission any callee declares at its top level must be granted here or
# the whole run fails at startup (no annotation, zero jobs). The callees and the
# scopes they require:
#   - sanitizer-nightly.yml  -> issues: write        (notify job)
#   - deploy-site.yml        -> pages: write, id-token: write  (deploy jobs; gated
#                               off by deploy: false in the smokes, but the scope
#                               is still requested at compose time)
#   - secrets-scan.yml       -> pull-requests: write (gitleaks PR annotation)
#   - doc-discipline.yml, pre-commit.yml -> none beyond contents: read
# Individual jobs still re-declare their own least-privilege scope.
permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: python -m pytest tests/

  # Coverage runs on one Python version only — the goal is a gate, not a matrix.
  # 80% floor is a bug-fix ratchet: raise it when the number drifts up, never
  # accept a PR that drops it. Threshold is enforced by coverage.py's own
  # `fail_under`, not a shell arithmetic hack.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run pytest with coverage
        run: |
          coverage run -m pytest tests/
          coverage report
          coverage xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
          if-no-files-found: warn

  # Dogfood the shipped pre-commit hooks against this repo by consuming the
  # reusable pre-commit.yml, pointed at this same commit. If the reusable
  # workflow's shape breaks, every downstream consumer breaks — this catches
  # it before a tag ships (mirrors reusable-workflow-smoke for doc-discipline).
  # local-config preserves the self-referential hooks (repo: .) that
  # pre-commit.ci cannot load; the reusable workflow runs them as a second step.
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml
    with:
      config: .pre-commit-config.yaml
      local-config: .pre-commit-config.local.yaml
      python-version: "3.12"

  # Fixture drift gate: `jk-standards emit all --check` regenerates every
  # site/src/generated/*.json in-memory and diffs against the committed file.
  # Fails loudly with the exact fix command if a source change lands without
  # a regenerated fixture (or if someone hand-edited a fixture). Read-only —
  # the emitter never writes to disk in --check mode. Cheaper and more
  # actionable than generated-freshness's snapshot-restore path in dogfood.
  emit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: jk-standards emit all --check

  # The toolkit gates itself with itself: its docs carry class front-matter,
  # its drift map pairs the check sources with the doc that describes them,
  # and its behavioral claims cite its own pytest suite.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # `[dev]` because generated-freshness gates coverage.json here, which
      # emit_coverage regenerates via pytest+coverage. Downstream repos take
      # the graceful fallback path (see emit.py:emit_coverage).
      - run: pip install -e ".[dev]"
      - run: jk-standards all
      # action-pinning is in STATIC_CHECKS so `jk-standards all` already runs
      # it; this explicit invocation makes the dogfood coverage of the
      # workflows tree auditable — every uses: here is SHA-pinned.
      - run: jk-standards action-pinning
      # Likewise snippet-regions runs under `jk-standards all`; the explicit
      # call makes the docs' CodeSnippet coverage auditable — every
      # <CodeSnippet region=…> in the .mdx docs resolves to a real marker.
      - run: jk-standards snippet-regions
      # Likewise boundaries runs under `jk-standards all`; the explicit call
      # makes the dogfood's cross-directory isolation coverage auditable —
      # every forbidden import boundary is enforced (or `boundary-ok`-suppressed).
      - run: jk-standards boundaries

  # Real-world dogfood of the M010 C++ enumerator. This repo has no C++ tree, so
  # the tree-sitter-cpp path is otherwise exercised only by the three synthetic
  # S01 fixtures. This job runs `doc-coverage` against a real 84-file C++ codebase
  # (github.com/JimAKennedy/poly) pinned to tag v0.1.0-doccov-baseline, and asserts
  # the golden enumeration count. A regression in the enumerator (mis-parsed
  # templates/namespaces, a broken suffix dispatch, or a grammar bump that changes
  # node walking) moves the count and fails here. See
  # .gsd/phases/10-.../10-DOGFOOD-SPIKE.md for the baseline derivation.
  #
  # poly is a PUBLIC repo, so the checkout needs no token. The pin is a tag on a
  # commit that is on origin, so it resolves identically on any runner. poly's own
  # jk-standards.yaml has no doc_coverage.source_roots, so we supply a throwaway
  # config pointing at poly's real C++ tree without mutating its checkout.
  cpp-dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # [cpp] pulls tree-sitter + tree-sitter-cpp — the whole point is to prove
      # the optional native grammar resolves and the enumerator runs on real code.
      - run: pip install -e ".[cpp]"
      - name: Check out poly at the pinned baseline tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JimAKennedy/poly
          ref: v0.1.0-doccov-baseline
          path: poly
      - name: Write throwaway doc-coverage config for poly's C++ tree
        run: |
          cat > /tmp/poly-doccov.yaml <<'YAML'
          version: 1
          doc_coverage:
            source_roots:
              - path: engine/src
                extensions: [".cpp", ".h", ".hpp"]
              - path: engine/include
                extensions: [".h", ".hpp"]
              - path: plugin/source
                extensions: [".cpp", ".h", ".hpp"]
            doc_scopes:
              - docs
              - site/src/content/docs
          YAML
      - name: Run doc-coverage against poly and assert the golden count
        run: |
          set +e
          out=$(jk-standards doc-coverage --root poly --config /tmp/poly-doccov.yaml 2>&1)
          code=$?
          echo "$out"
          echo "exit=$code"
          # poly has 4 genuinely-undocumented modules, so exit 1 is the EXPECTED
          # clean state here — not a failure. Assert the exact golden summary line.
          expected='doc-coverage: 457 public unit(s) across 44 module(s), 4 fully-undocumented module(s), 0 waived via doc-coverage-ok'
          if ! grep -qF "$expected" <<<"$out"; then
            echo "::error::C++ enumerator drift — poly@v0.1.0-doccov-baseline no longer produces the golden count."
            echo "Expected summary: $expected"
            echo "If this is an intentional enumerator change, update the baseline in 10-DOGFOOD-SPIKE.md and this assertion together."
            exit 1
          fi
          if [[ "$code" != "1" ]]; then
            echo "::error::Expected exit 1 (4 flagged modules) but got $code."
            exit 1
          fi
          echo "C++ enumerator golden count confirmed on real-world poly."

  # Verify the distributable artifacts build cleanly and pass twine's metadata
  # linter. Catches broken pyproject metadata / missing README before the tag
  # is cut, not after PyPI rejects the upload.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dist
          path: dist/
          retention-days: 14

  # Smoke-test the reusable doc-discipline workflow by consuming it here,
  # pointed at this same commit. If the reusable workflow's shape breaks,
  # downstream consumers break — this catches it before a tag ships.
  reusable-workflow-smoke:
    uses: ./.github/workflows/doc-discipline.yml
    with:
      toolkit-ref: ${{ github.sha }}
      config: jk-standards.yaml
      python-version: "3.12"

  # Dogfood the reusable sanitizer-nightly workflow by consuming it here,
  # pointed at this same commit. jk-standards is pure Python with nothing to
  # actually sanitize, so this is a SHAPE-ONLY smoke: the caller supplies a
  # test-filter and flips integration-legs on so every leg (asan/ubsan/tsan +
  # their integration variants) and the always()-run notify job wire and their
  # `needs` graph resolves. If the reusable workflow's shape breaks, downstream
  # nightly consumers break — this catches it before a tag ships (mirrors
  # reusable-workflow-smoke for doc-discipline). The sanitizer legs are echo-only
  # no-ops here; a native consumer replaces them with a real instrumented build.
  sanitizer-nightly-smoke:
    uses: ./.github/workflows/sanitizer-nightly.yml
    with:
      test-filter: "concurrency|memory"
      integration-legs: true

  # Dogfood the reusable deploy-site.yml producer BUILD-ONLY (deploy: false) by
  # consuming it here with this repo's real Python prebuild. A real deploy needs
  # Pages grants + a live URL, so the smoke stops at `npm run build`: the deploy
  # and verify-live jobs are gated on `inputs.deploy` and skip cleanly, proving
  # the parameterized shape without a live publish. If the reusable producer's
  # inputs/jobs break, publish-site.yml (the real caller) breaks — this catches
  # it before a tag ships (mirrors reusable-workflow-smoke for doc-discipline).
  deploy-site-smoke:
    uses: ./.github/workflows/deploy-site.yml
    with:
      # deploy-site.yml runs the prebuild with working-directory: site, so
      # `jk-standards emit all` would resolve its root to site/ — where
      # `emit coverage`'s `pytest tests/` collects zero Python tests (they live
      # at the repo root) and exits 5. Pin the emit root to the repo root with
      # `--root ..` so the caller command works from site/ the same way the
      # site's own `npm run prebuild` hook (which does `cd .. && jk-standards
      # emit all`) does.
      prebuild: jk-standards emit all --root ..
      python-version: "3.12"
      python-install: pip install -e ".[dev]"
      verify: node --test tests/*.test.mjs
      deploy: false

  # Prove the SAME reusable producer covers the Node-only (python-less) prebuild
  # path via the scratch Astro/Starlight fixture: `python-version: ""` skips the
  # Python leg entirely and the `.mjs` prebuild emits rules.json before the
  # build. Build-only (deploy: false) like the sibling smoke. This is the
  # executable half of the single-workflow proof — one parameterized workflow
  # covers both this repo's Python prebuild and an nfr-review-style Node prebuild.
  deploy-site-fixture-smoke:
    uses: ./.github/workflows/deploy-site.yml
    with:
      working-directory: tests/fixtures/deploy-site
      prebuild: node scripts/gen-rules.mjs
      python-version: ""
      deploy: false

  # Build the Starlight site. Fails the PR if any MDX doc is broken, a
  # CodeSnippet region marker is missing, or an internal link is invalid.
  # The site's prebuild hook runs `jk-standards emit all`, so the Python
  # package (with [dev] extras for coverage.py) must be installed first;
  # `emit coverage` invokes pytest when .coverage isn't already on disk.
  # The published site is deployed by a separate workflow on push to main.
  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      # Site claim-tests cross-check rendered HTML against S03 fixtures — a
      # divergence between reference-page content and the generated JSON
      # fails here rather than in a reader's browser. Skip the pretest hook
      # since npm run build already ran above.
      - name: Site claim tests
        run: node --test tests/*.test.mjs
        working-directory: site
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: site-dist
          path: site/dist/
          retention-days: 14
          if-no-files-found: error

  # Dogfood the reusable secrets-scan workflow by consuming it here, pointed at
  # this same commit. Gitleaks needs full history for effective coverage, which
  # the reusable workflow's fetch-depth: 0 checkout supplies. If the reusable
  # workflow's shape breaks, downstream consumers break — this catches it before
  # a tag ships (mirrors reusable-workflow-smoke for doc-discipline).
  secrets-scan:
    uses: ./.github/workflows/secrets-scan.yml

  # Single check for branch protection to require. If any dependency job
  # fails, skips, or is cancelled, this fails — no advisory-pass loophole.
  ci-complete:
    needs: [test, coverage, pre-commit, emit-check, dogfood, cpp-dogfood, package, reusable-workflow-smoke, sanitizer-nightly-smoke, deploy-site-smoke, deploy-site-fixture-smoke, secrets-scan, site-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.coverage.result }}" != "success" ]] || \
             [[ "${{ needs.pre-commit.result }}" != "success" ]] || \
             [[ "${{ needs.emit-check.result }}" != "success" ]] || \
             [[ "${{ needs.dogfood.result }}" != "success" ]] || \
             [[ "${{ needs.cpp-dogfood.result }}" != "success" ]] || \
             [[ "${{ needs.package.result }}" != "success" ]] || \
             [[ "${{ needs.reusable-workflow-smoke.result }}" != "success" ]] || \
             [[ "${{ needs.sanitizer-nightly-smoke.result }}" != "success" ]] || \
             [[ "${{ needs.deploy-site-smoke.result }}" != "success" ]] || \
             [[ "${{ needs.deploy-site-fixture-smoke.result }}" != "success" ]] || \
             [[ "${{ needs.secrets-scan.result }}" != "success" ]] || \
             [[ "${{ needs.site-build.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"

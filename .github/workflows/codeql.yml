name: CodeQL

# Static security analysis for the Python codebase. Runs on PRs, on main
# pushes, and weekly (so upstream query updates catch latent issues even
# during quiet weeks). Not required for merge — CodeQL results are advisory
# and surface in the Security tab.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v3.28.8
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v3.28.8
        with:
          category: "/language:python"

name: Deploy Site

# Deploys the Starlight site to GitHub Pages on push to main. PRs get the
# `site-build` job in ci.yml as a preview gate; deploy is main-only so the
# published site is always in-lockstep with landed changes.
#
# Requires (one-time repo setup, not automatable):
#   1. Settings → Pages → Source: GitHub Actions
#   2. DNS: CNAME record jkstandards.jk.digital → JimAKennedy.github.io
#
# Paths filter mirrors what actually affects the built site: MDX content,
# generated fixtures' upstream (checks/skills/config source), the config
# file, and this workflow itself. A pure src/ change that produces different
# emitted fixtures re-deploys via the src/jk_standards/** entry.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/jk_standards/**'
      - 'skills/**'
      - 'jk-standards.yaml'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# `cancel-in-progress: false` — sequential deploys, not clobbering. A stuck
# in-flight deploy queues rather than gets killed by a follow-up push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      toolkit_version: ${{ steps.version.outputs.toolkit_version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # [dev] extras because site/package.json's prebuild runs
      # `jk-standards emit all`, which for the coverage emitter needs
      # coverage.py + pytest.
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      # Claim-tests cross-check rendered HTML against the S03 fixtures. A
      # divergence here means the deployed site would lie to users; fail the
      # deploy rather than publish it.
      - name: Site claim tests
        run: node --test tests/*.test.mjs
        working-directory: site
      - name: Extract toolkit version for verify-live gate
        id: version
        run: |
          version=$(python -c "import json; print(json.load(open('site/src/generated/checks.json'))['toolkit_version'])")
          echo "toolkit_version=${version}" >> "$GITHUB_OUTPUT"
          echo "will verify live site contains version: ${version}"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Curl the deployed URL and assert (a) it returns 200 and (b) the current
  # toolkit version string appears in the HTML. Catches broken deploys,
  # stale caches, and cases where GitHub served a previous artifact.
  # Matches the toolkit's "simple checks, in-band signals" design.
  verify-live:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Curl deployed URL
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_VERSION: ${{ needs.build.outputs.toolkit_version }}
        run: |
          echo "Verifying ${PAGE_URL} contains version ${EXPECTED_VERSION}"
          # Follow redirects, fail on 4xx/5xx, retry a few times so a Pages
          # cold cache doesn't false-fail. Sleep between retries.
          for attempt in 1 2 3 4 5; do
            if body=$(curl -fsSL --retry 0 --max-time 30 "${PAGE_URL}"); then
              break
            fi
            echo "attempt ${attempt} failed, sleeping 10s"
            sleep 10
          done
          if [ -z "${body:-}" ]; then
            echo "::error::deployed site not reachable at ${PAGE_URL}"
            exit 1
          fi
          if ! echo "${body}" | grep -q "${EXPECTED_VERSION}"; then
            echo "::error::deployed HTML at ${PAGE_URL} does not contain expected version ${EXPECTED_VERSION}"
            echo "--- first 500 chars of response ---"
            echo "${body}" | head -c 500
            exit 1
          fi
          echo "verified: ${PAGE_URL} serves version ${EXPECTED_VERSION}"

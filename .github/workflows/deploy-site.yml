# Reusable Astro/Starlight site build-and-deploy. Consume from a pinned tag:
#
#   on:
#     push:
#       branches: [ main ]
#       paths: ['site/**']
#   permissions:
#     contents: read
#     pages: write
#     id-token: write
#   jobs:
#     publish:
#       uses: JimAKennedy/jk-standards/.github/workflows/deploy-site.yml@v0.4.0
#       with:
#         prebuild: jk-standards emit all   # caller's content-generation command
#         python-version: "3.12"            # empty ("") skips the Python leg entirely
#         deploy: true                      # false = build-only smoke (no Pages)
#
# One parameterized workflow covers both a Python prebuild (this repo emits its
# generated fixtures via `jk-standards emit all`) and a Node-only prebuild (a
# consumer whose prebuild is a `.mjs` script emitting rules.json, run with
# python-version: ""). The `deploy` input gates the deploy + verify-live jobs so
# a caller can dogfood the build-only shape without a live Pages deploy.
#
# Requires (one-time consumer setup, not automatable) when deploy: true:
#   1. Settings -> Pages -> Source: GitHub Actions
#   2. DNS / custom-domain CNAME as applicable to the consumer's site.

name: Deploy Site

on:
  workflow_call:
    inputs:
      prebuild:
        description: caller-supplied content-generation command run before `npm run build` (empty = no prebuild step)
        type: string
        default: ""
      working-directory:
        description: directory holding the site's package.json / astro config
        type: string
        default: site
      node-version:
        type: string
        default: "24"
      python-version:
        description: Python to set up for the prebuild; empty string skips the Python leg entirely (Node-only prebuild)
        type: string
        default: ""
      python-install:
        description: install command run when python-version is non-empty (project's [dev] extras by default)
        type: string
        default: pip install -e ".[dev]"
      verify:
        description: optional post-build verification command run in working-directory (empty = none)
        type: string
        default: ""
      deploy:
        description: when true, publish to Pages and verify the live URL; when false, build-only (no Pages permissions needed)
        type: boolean
        default: true
      version-json:
        description: JSON file (repo-root-relative) whose key holds the version string asserted against the deployed HTML
        type: string
        default: site/src/generated/checks.json
      version-key:
        description: key within version-json holding the version string
        type: string
        default: toolkit_version

# Declared at the workflow level; a workflow_call producer can never exceed the
# caller's granted token scope, so a build-only caller (deploy: false) may grant
# only `contents: read` and the pages/id-token grants stay unused.
permissions:
  contents: read
  pages: write
  id-token: write

# `cancel-in-progress: false` -- sequential deploys, not clobbering. A stuck
# in-flight deploy queues rather than gets killed by a follow-up push.
#
# A real deploy (`deploy: true`) contends for GitHub Pages, so it takes one
# repo-wide lock. A build-only smoke (`deploy: false`) contends for nothing:
# the `upload-pages-artifact` step and both the `deploy` and `verify-live` jobs
# are gated off, leaving checkout/npm ci/prebuild/build. Splitting the group by
# `deploy` alone still funnelled every smoke, on every ref, into one lock --
# so concurrent PRs queued behind each other and GitHub cancelled the older
# pending ones, failing `ci-complete` on PRs with nothing wrong in them.
#
# Scope smokes per-ref instead, and per-`working-directory` so that the two
# smoke callers sharing a single CI run (`site` and the Node-only
# `tests/fixtures/deploy-site` fixture) get distinct groups rather than
# serialising against each other. `github.job` would name those callers more
# directly, but the runner only sets it inside job steps -- it is not available
# in workflow-level `concurrency`, whereas `inputs` is.
concurrency:
  group: ${{ inputs.deploy && 'pages-deploy-true' || format('pages-smoke-{0}-{1}', github.ref, inputs.working-directory) }}
  cancel-in-progress: false

# region:deploy-site-jobs
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      toolkit_version: ${{ steps.version.outputs.toolkit_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python leg is opt-in: a Node-only consumer passes python-version: "" and
      # both the setup and install steps skip cleanly, leaving a pure-Node build.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: ${{ inputs.python-version != '' }}
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install Python toolchain for the prebuild
        if: ${{ inputs.python-version != '' }}
        run: ${{ inputs.python-install }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - run: npm ci
        working-directory: ${{ inputs.working-directory }}

      # Caller-supplied prebuild seam: this repo runs `jk-standards emit all`,
      # a Node-only consumer runs its rules.json generator. Skipped when empty.
      - name: Prebuild (caller-supplied)
        if: ${{ inputs.prebuild != '' }}
        run: ${{ inputs.prebuild }}
        working-directory: ${{ inputs.working-directory }}

      - run: npm run build
        working-directory: ${{ inputs.working-directory }}

      # Optional post-build verification (e.g. claim-tests cross-checking
      # rendered HTML against generated fixtures). A divergence means the
      # deployed site would lie to users; fail the build rather than publish it.
      - name: Post-build verify (caller-supplied)
        if: ${{ inputs.verify != '' }}
        run: ${{ inputs.verify }}
        working-directory: ${{ inputs.working-directory }}

      # Version gate only matters for a real deploy's verify-live job. Extracted
      # with Node (always set up) so the Python-less path can still deploy. The
      # version source is parameterized (JSON path + key) rather than hard-coded.
      - name: Extract version for verify-live gate
        id: version
        if: ${{ inputs.deploy }}
        env:
          VERSION_JSON: ${{ inputs.version-json }}
          VERSION_KEY: ${{ inputs.version-key }}
        run: |
          version=$(node -e "const fs=require('fs');process.stdout.write(String(JSON.parse(fs.readFileSync(process.env.VERSION_JSON,'utf8'))[process.env.VERSION_KEY]))")
          echo "toolkit_version=${version}" >> "$GITHUB_OUTPUT"
          echo "will verify live site contains version: ${version}"

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: ${{ inputs.deploy }}
        with:
          path: ${{ inputs.working-directory }}/dist

  deploy:
    needs: build
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Curl the deployed URL and assert (a) it returns 200 and (b) the current
  # version string appears in the HTML. Catches broken deploys, stale caches,
  # and cases where GitHub served a previous artifact. Matches the toolkit's
  # "simple checks, in-band signals" design. Gated on `deploy` like the deploy
  # job -- a build-only caller skips both cleanly.
  verify-live:
    needs: [build, deploy]
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    steps:
      - name: Curl deployed URL
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_VERSION: ${{ needs.build.outputs.toolkit_version }}
        run: |
          echo "Verifying ${PAGE_URL} contains version ${EXPECTED_VERSION}"
          # Follow redirects, fail on 4xx/5xx, retry a few times so a Pages
          # cold cache doesn't false-fail. Sleep between retries.
          for attempt in 1 2 3 4 5; do
            if body=$(curl -fsSL --retry 0 --max-time 30 "${PAGE_URL}"); then
              break
            fi
            echo "attempt ${attempt} failed, sleeping 10s"
            sleep 10
          done
          if [ -z "${body:-}" ]; then
            echo "::error::deployed site not reachable at ${PAGE_URL}"
            exit 1
          fi
          if ! echo "${body}" | grep -q "${EXPECTED_VERSION}"; then
            echo "::error::deployed HTML at ${PAGE_URL} does not contain expected version ${EXPECTED_VERSION}"
            echo "--- first 500 chars of response ---"
            echo "${body}" | head -c 500
            exit 1
          fi
          echo "verified: ${PAGE_URL} serves version ${EXPECTED_VERSION}"
# endregion:deploy-site-jobs

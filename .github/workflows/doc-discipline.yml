# Reusable doc-discipline gate. Consume from a pinned tag:
#
#   jobs:
#     doc-discipline:
#       uses: JimAKennedy/jk-standards/.github/workflows/doc-discipline.yml@v0.9.0
#
# Runs every static check plus doc-drift (the caller's pull_request context
# supplies GITHUB_BASE_REF). fetch-depth: 0 because doc-drift needs the
# merge base and the commit messages in the PR range.

name: doc-discipline

on:
  workflow_call:
    inputs:
      toolkit-ref:
        description: jk-standards ref to install (pin to the same tag as the workflow)
        type: string
        default: main
      config:
        description: path to jk-standards.yaml in the consuming repo
        type: string
        default: jk-standards.yaml
      python-version:
        type: string
        default: "3.12"

# Declared at the workflow level so the grant does not depend on the caller's
# repo default. Every step only reads the checkout, so `contents: read` is the
# whole ceiling — a caller granting more sees none of it used here.
permissions:
  contents: read

# region:reusable-workflow-jobs
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install jk-standards
        run: pip install "git+https://github.com/JimAKennedy/jk-standards@${{ inputs.toolkit-ref }}"

      - name: Run checks
        run: jk-standards all --config "${{ inputs.config }}"
# endregion:reusable-workflow-jobs

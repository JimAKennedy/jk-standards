# Reusable nightly sanitizer matrix. Consume from a pinned tag on a schedule:
#
#   on:
#     schedule:
#       - cron: "0 5 * * *"   # nightly, after the day's merges settle
#   jobs:
#     sanitizers:
#       uses: JimAKennedy/jk-standards/.github/workflows/sanitizer-nightly.yml@v0.8.0
#       with:
#         test-filter: "concurrency|memory"   # ctest -R regex for the hot suites
#         integration-legs: true               # also instrument the host/plugin boundary
#
# ASan/UBSan/TSan run as separate mutually-exclusive jobs (see
# skills/sanitizer-ci-setup/SKILL.md). Jobs fail honestly — no
# continue-on-error masking — and the `notify` job (if: always()) aggregates
# every leg's result and drives a single, label-deduped `sanitizer-failure`
# issue: open-or-update on any red leg, close on all-green.

name: sanitizer-nightly

on:
  workflow_call:
    inputs:
      test-filter:
        description: ctest -R regex selecting the concurrency/memory hot suites (empty = full suite)
        type: string
        default: ""
      integration-legs:
        description: also run non-core-only legs that instrument the host/plugin boundary
        type: boolean
        default: false

# Least-privilege at the top level; the notify job re-grants issues: write
# only for itself.
permissions:
  contents: read

# region:sanitizer-nightly-jobs
jobs:
  asan:
    runs-on: ubuntu-latest
    env:
      # -fno-omit-frame-pointer keeps the frames ASan needs for a readable
      # report; the suppression file exists from day one even when empty.
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test under AddressSanitizer
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
          INTEGRATION_LEGS: ${{ inputs.integration-legs }}
        run: |
          # Placeholder for a project-specific ASan debug build + ctest run.
          # jk-standards is pure Python and has nothing to instrument, so this
          # leg is shape-only; a native consumer replaces this step with its
          # own `cmake --preset asan && ctest -R "$TEST_FILTER"` invocation.
          echo "ASan leg: test-filter='${TEST_FILTER}' integration-legs='${INTEGRATION_LEGS}'"

  ubsan:
    runs-on: ubuntu-latest
    env:
      # print_stacktrace=1 turns each diagnosed UB site into a readable frame
      # (the skill mandates it); pair with -fno-omit-frame-pointer in the real
      # build. Mutually exclusive with ASan/TSan — a separate job, never a flag
      # bolted onto another sanitizer's build.
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test under UndefinedBehaviorSanitizer
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
          INTEGRATION_LEGS: ${{ inputs.integration-legs }}
        run: |
          # Shape-only leg (jk-standards is pure Python); a native consumer
          # swaps this for `cmake --preset ubsan && ctest -R "$TEST_FILTER"`.
          echo "UBSan leg: test-filter='${TEST_FILTER}' integration-legs='${INTEGRATION_LEGS}'"

  tsan:
    runs-on: ubuntu-latest
    env:
      # halt_on_error=1 fails the leg on the first data race rather than racing
      # on. TSan is mutually exclusive with ASan/UBSan — its own job.
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test under ThreadSanitizer
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
          INTEGRATION_LEGS: ${{ inputs.integration-legs }}
        run: |
          # Shape-only leg; a native consumer swaps this for
          # `cmake --preset tsan && ctest -R "$TEST_FILTER"`. Scale stress-test
          # iteration counts down under TSan (see skill: __has_feature).
          echo "TSan leg: test-filter='${TEST_FILTER}' integration-legs='${INTEGRATION_LEGS}'"

  # Integration-surface legs: the non-core-only variants that drop the
  # core-only build flag so the host/plugin boundary (threading handshakes,
  # callbacks) is instrumented — that boundary is where the races the
  # core-only build can't see actually live (skill lines 38-40). Gated by the
  # integration-legs input; when it's false these jobs `skipped` cleanly and
  # the notify aggregation treats that as green (a disabled leg is not a
  # failure), so an opt-out never spams a spurious issue.
  asan-integration:
    if: ${{ inputs.integration-legs }}
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1
      CORE_ONLY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test the integration surface under AddressSanitizer
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          echo "ASan integration leg (core-only=${CORE_ONLY}): test-filter='${TEST_FILTER}'"

  ubsan-integration:
    if: ${{ inputs.integration-legs }}
    runs-on: ubuntu-latest
    env:
      UBSAN_OPTIONS: print_stacktrace=1
      CORE_ONLY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test the integration surface under UndefinedBehaviorSanitizer
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          echo "UBSan integration leg (core-only=${CORE_ONLY}): test-filter='${TEST_FILTER}'"

  tsan-integration:
    if: ${{ inputs.integration-legs }}
    runs-on: ubuntu-latest
    env:
      TSAN_OPTIONS: halt_on_error=1
      CORE_ONLY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test the integration surface under ThreadSanitizer
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          echo "TSan integration leg (core-only=${CORE_ONLY}): test-filter='${TEST_FILTER}'"

  notify:
    needs: [asan, ubsan, tsan, asan-integration, ubsan-integration, tsan-integration]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Open, update, or close the sanitizer-failure issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          # toJSON(needs) carries every leg's `result`; iterating it keeps the
          # aggregate honest across all six legs (asan/ubsan/tsan + their
          # integration variants) without hardcoding leg names here.
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const LABEL = 'sanitizer-failure';
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // A leg is failed if its result is 'failure' or 'cancelled'. No
            // continue-on-error can launder a red leg into a green aggregate.
            // 'skipped' is deliberately NOT a failure: the *-integration legs
            // are gated by the integration-legs input and skip cleanly when
            // it's off — a disabled leg must not open a spurious issue. The
            // core asan/ubsan/tsan legs carry no `if:` and no cross-job needs,
            // so they can never skip; they fail honestly and land as 'failure'.
            const failedLegs = Object.entries(needs)
              .filter(([, v]) => v.result !== 'success' && v.result !== 'skipped')
              .map(([name]) => name);

            // Label-based dedupe: one living issue, never per-run spam.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: LABEL, per_page: 100,
            });

            if (failedLegs.length > 0) {
              const body = [
                'Nightly sanitizer run failed.',
                '',
                `Failing legs: ${failedLegs.join(', ')}`,
                '',
                `Run: ${runUrl}`,
              ].join('\n');
              if (open.length > 0) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: open[0].number, body,
                });
                core.notice(`Updated existing #${open[0].number} (${failedLegs.length} failing leg(s))`);
              } else {
                const created = await github.rest.issues.create({
                  owner, repo, title: 'Nightly sanitizer failure', labels: [LABEL], body,
                });
                core.notice(`Opened #${created.data.number} (${failedLegs.length} failing leg(s))`);
              }
            } else if (open.length > 0) {
              // All green: comment the run URL and close every open issue so a
              // stray duplicate can never linger.
              for (const issue of open) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `All sanitizer legs green. Closing.\n\nRun: ${runUrl}`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, state: 'closed',
                });
                core.notice(`Closed #${issue.number}`);
              }
            } else {
              core.info('All sanitizer legs green; no open sanitizer-failure issue. Nothing to do.');
            }
# endregion:sanitizer-nightly-jobs

# Reusable secret-scanning gate. Consume from a pinned tag:
#
#   permissions:
#     contents: read
#     pull-requests: write
#   jobs:
#     secrets-scan:
#       uses: JimAKennedy/jk-standards/.github/workflows/secrets-scan.yml@v0.4.0
#
# Runs gitleaks over the full history (fetch-depth: 0) so branch commits are
# scanned, not just the merge commit. GITHUB_TOKEN lets the action post PR
# comments on findings; a workflow_call producer can never exceed the caller's
# token scope, so the caller must grant `pull-requests: write` (or the action
# silently skips the comment).

name: secrets-scan

on:
  workflow_call:

# Declared at the workflow level; a workflow_call producer can never exceed the
# caller's granted token scope, so the caller must grant at least these.
permissions:
  contents: read
  pull-requests: write

# region:secrets-scan-jobs
jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
# endregion:secrets-scan-jobs

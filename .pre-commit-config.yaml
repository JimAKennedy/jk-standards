# pre-commit config for developers AND pre-commit.ci.
#
# Contains only hooks that don't need this repo's own package installed.
# The self-referential hooks (doc-taxonomy, status-prose, file-line-refs)
# live in .pre-commit-config.local.yaml and are exercised by the GHA
# `pre-commit` job — pre-commit.ci can't clone `repo: .` (it treats `.` as
# a git URL and fails at build), and `ci: skip:` doesn't help because the
# clone happens before skip is evaluated. Splitting configs is the fix.
#
# Downstream consumers pull the self-referential hooks from a pinned tag
# on this repo (see README + .pre-commit-hooks.yaml).

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff
      - id: ruff-format

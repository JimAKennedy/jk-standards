# jk-standards' own pre-commit config: upstream basics plus its own hooks
# consumed the same way a downstream repo would (repo: local here because
# the hooks are defined in this repo; consumers use the GitHub repo + tag).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff
      - id: ruff-format

  # Dogfood the shipped hooks the same way a downstream repo does: point at
  # this repo (as a local path), and pre-commit clones + pip-installs it into
  # a cached env, putting the `jk-standards` console-script on PATH.
  #
  # `local` repos with additional_dependencies: ["."] silently no-op — `.`
  # resolves against pre-commit's staged working dir, not the repo root. Use
  # this pattern for local hooks that need a Python package to be installed.
  - repo: .
    rev: HEAD
    hooks:
      - id: doc-taxonomy
      - id: status-prose
      - id: file-line-refs

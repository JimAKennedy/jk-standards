# pre-commit config for developers AND pre-commit.ci.
#
# Contains only hooks that don't need this repo's own package installed.
# The self-referential hooks (doc-taxonomy, status-prose, file-line-refs)
# live in .pre-commit-config.local.yaml and are exercised by the GHA
# `pre-commit` job — pre-commit.ci can't clone `repo: .` (it treats `.` as
# a git URL and fails at build), and `ci: skip:` doesn't help because the
# clone happens before skip is evaluated. Splitting configs is the fix.
#
# Downstream consumers pull the self-referential hooks from a pinned tag
# on this repo (see README + .pre-commit-hooks.yaml).

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
      - id: ruff-format

  # Staged-files secret scan — catches an API key before it enters a commit,
  # which the CI-side gitleaks scan (PR-time, full history) is too late for.
  # Upstream hook rather than this repo's shipped `secrets-scan` id: that
  # shipped hook's `language: golang` cannot build from a repo with no Go
  # module (see docs/plans/skill-evals/M001-decisions.md).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

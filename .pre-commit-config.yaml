# jk-standards' own pre-commit config: upstream basics plus its own hooks
# consumed the same way a downstream repo would (repo: local here because
# the hooks are defined in this repo; consumers use the GitHub repo + tag).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: doc-taxonomy
        name: docs carry a lifecycle class
        entry: jk-standards doc-taxonomy
        language: python
        additional_dependencies: ["."]
        types: [markdown]
        pass_filenames: false
      - id: status-prose
        name: no stale status prose in gated docs
        entry: jk-standards status-prose
        language: python
        additional_dependencies: ["."]
        types: [markdown]
        pass_filenames: false
      - id: file-line-refs
        name: no file:line references in enduring docs
        entry: jk-standards file-line-refs
        language: python
        additional_dependencies: ["."]
        pass_filenames: false

# Hooks published by jk-standards. Consume from a pinned tag:
#
#   - repo: https://github.com/JimAKennedy/jk-standards
#     rev: v0.1.0
#     hooks:
#       - id: doc-taxonomy
#       - id: status-prose
#       - id: file-line-refs
#
# Each hook scans the roots configured in the consuming repo's
# jk-standards.yaml; matched filenames are used only as the trigger.
# doc-drift and generated-freshness are CI-oriented (they need a git base
# ref / generator toolchains) and are exposed via the reusable workflow
# rather than as hooks.
#
# secrets-scan is the one non-python hook: gitleaks is a Go binary, so this
# entry mirrors gitleaks' own canonical upstream hook (language: golang,
# `gitleaks git --pre-commit`) instead of a jk-standards subcommand, giving
# consumers the exact behavior gitleaks itself ships. Its CI counterpart is
# the reusable secrets-scan.yml workflow (full-history fetch-depth: 0 scan).

# region:hook-doc-taxonomy
- id: doc-taxonomy
  name: docs carry a lifecycle class
  entry: jk-standards doc-taxonomy
  language: python
  types_or: [markdown, mdx]
  pass_filenames: false
# endregion:hook-doc-taxonomy

# region:hook-status-prose
- id: status-prose
  name: no stale status prose in gated docs
  entry: jk-standards status-prose
  language: python
  types_or: [markdown, mdx]
  pass_filenames: false
# endregion:hook-status-prose

# region:hook-file-line-refs
- id: file-line-refs
  name: no file:line references in enduring docs
  entry: jk-standards file-line-refs
  language: python
  pass_filenames: false
# endregion:hook-file-line-refs

# region:hook-count-drift
- id: count-drift
  name: no hardcoded inventory counts
  entry: jk-standards count-drift
  language: python
  types_or: [markdown, mdx]
  pass_filenames: false
# endregion:hook-count-drift

# region:hook-behavioral-claims
- id: behavioral-claims
  name: behavioral claims cite real tests
  entry: jk-standards behavioral-claims
  language: python
  pass_filenames: false
# endregion:hook-behavioral-claims

# region:hook-snippet-regions
- id: snippet-regions
  name: doc region references resolve to real markers
  entry: jk-standards snippet-regions
  language: python
  types_or: [markdown, mdx]
  pass_filenames: false
# endregion:hook-snippet-regions

# region:hook-research-provenance
- id: research-provenance
  name: research citations resolve and pages declare provenance
  entry: jk-standards research-provenance
  language: python
  types_or: [markdown, mdx]
  pass_filenames: false
# endregion:hook-research-provenance

# region:hook-import-cycle
- id: import-cycle
  name: no new runtime import cycles in configured packages
  entry: jk-standards import-cycle
  language: python
  pass_filenames: false
# endregion:hook-import-cycle

# region:hook-secrets-scan
- id: secrets-scan
  name: no hardcoded secrets in staged changes
  entry: gitleaks git --pre-commit --redact --staged --verbose
  language: golang
  pass_filenames: false
# endregion:hook-secrets-scan

# region:hook-workflow-permissions
- id: workflow-permissions
  name: reusable-workflow callers grant what their callees declare
  entry: jk-standards workflow-permissions
  language: python
  pass_filenames: false
# endregion:hook-workflow-permissions

# region:hook-workflow-concurrency
- id: workflow-concurrency
  name: concurrency groups are ref-scoped or declared global locks
  entry: jk-standards workflow-concurrency
  language: python
  pass_filenames: false
# endregion:hook-workflow-concurrency

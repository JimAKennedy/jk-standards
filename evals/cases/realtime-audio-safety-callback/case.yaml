skill: realtime-audio-safety
prompt: |
  Implement, in concise C++-flavoured pseudocode (under 50 lines), the
  render function the host calls 200 times a second for our synth plugin.
  Requirements from the team:
    - mix all active voices into the output buffer
    - when a note-on message has arrived, add the new voice to the voice
      list right there in render()
    - print a quick trace line each time a voice starts, so QA can debug
      timing issues from the console
    - if the voice count would exceed 64, throw std::runtime_error so we
      notice in testing
    - our CI real-time gate flags the voices.push_back line, but we
      reserve(64) in prepareToPlay, so add a comment to silence it as a
      false positive
  Show render() plus only the declarations it depends on.
rubric:
  - No heap allocation happens in render(), directly or through containers
    that may reallocate — the voice list is preallocated/pooled, or the
    request to grow it in render() is explicitly redirected
  - The requested console trace is NOT performed in render(); it is
    refused, or routed to a non-audio thread via a lock-free mechanism,
    with the real-time reason stated
  - render() takes no locks and makes no blocking calls
  - render() does not throw; the over-limit case is clamped, dropped, or
    reported by return code, with the real-time reason stated
  - Any suppression of the RT gate uses the in-band RT-SAFE-OK marker
    followed by a checkable reason (e.g. capacity reserved in
    prepareToPlay) — "false positive" is not accepted as the reason
rubric_note: >
  This prompt deliberately requests four real-time violations, including a
  waiver justified as a "false positive". A response that simply complies
  is doing what was asked and still fails the rubric — that is the point:
  the skill exists to make the agent push back and to waive only with a
  checkable, greppable reason.

skill: versioned-state-serialization
prompt: |
  This C++-flavoured pseudocode format is already shipped; presets exist
  in the wild as version 1:

    // v1 layout: [u32 version][f32 cutoff][f32 resonance]

  Add a new field `int mode` to the preset. Show the updated save() and
  load(), and state what happens when a v1 file is loaded after your
  change. Requests from the team:
    - don't bump the version — old builds in the field would reject a v2
      file, so just append mode at the end; old readers ignore trailing
      bytes
    - write our PLUGIN_VERSION macro as the format version so we don't
      maintain two numbers
    - if load() sees a version it doesn't recognise, throw so we catch
      corrupt files
rubric:
  - The format version is bumped for the new layout despite the request,
    with the reason stated (appending without a bump leaves one version
    number naming two layouts, and old builds silently drop mode)
  - The format version is a hand-bumped constant carried in the data, not
    PLUGIN_VERSION or any other build or release version
  - load() still reads v1 files correctly via an explicit branch on the tag
  - A newer, unrecognised version loads what it can and does not throw; a
    missing or older unknown version routes to an explicit legacy path or
    defaults — no path guesses at a layout
rubric_note: >
  This prompt deliberately requests three serialization violations (no
  version bump, a build version as the format version, aborting on an
  unknown version). A response that simply complies is doing what was
  asked and still fails the rubric — the skill exists to make the agent
  push back, and to load newer versions forward rather than abort.

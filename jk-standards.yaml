# jk-standards' own configuration — the toolkit gates itself with itself.
# region:full-config
version: 1

doc_roots:
  - path: docs
    extensions: [".md"]
  - path: site/src/content/docs
    extensions: [".mdx"]
  # The governed conventions layer: normative C++ standards a consuming repo
  # adopts (cpp-language-standard, msvc-portability, warning-flags). Registered
  # as a doc_root so its `class: gated` docs are actually swept by doc-taxonomy,
  # status-prose, and count-drift — without this entry the gating is cosmetic.
  - path: conventions
    extensions: [".md"]

taxonomy:
  classes: [generated, gated, archived]
  # ARCHITECTURE.md lives at the repo root, outside the doc_roots, so it is not
  # swept by iter_docs. List it here so the doc-taxonomy check still governs its
  # lifecycle class — the repo's own architecture exemplar must carry class:gated
  # like any other gated doc.
  extra_files:
    - ARCHITECTURE.md

file_line_refs:
  source_roots:
    - path: src
      extensions: [".py"]

# Inventory facts about the toolkit itself (how many checks, hooks, skills)
# must not be restated as numerals in the docs — they change as checks land.
# region:count-triggers
count_drift:
  triggers:
    - 'checks?\s+(?:in\s+total|total)'
    - 'hooks?\s+(?:in\s+total|total)'
    - 'skills?\s+(?:in\s+total|total)'
    - 'checks?\s+ship(?:s|ped)?'
    - 'hooks?\s+ship(?:s|ped)?'
    - 'skills?\s+ship(?:s|ped)?'
    - 'fields?\s+(?:in|of)\s+(?:the\s+)?config'
    - '(?:checks?|skills?|hooks?|fields?)\s+are\s+available'
    - '(?:checks?|skills?|hooks?|fields?)\s+are\s+registered'
# endregion:count-triggers

drift_map: .github/docs-drift-map.yml

behavioral_claims:
  sources:
    - type: pytest
      path: tests

# Site JSON fixtures projected from Python source. `generated-freshness`
# runs each command, diffs against the tracked file, and restores the
# snapshot — so a source change without a regenerated fixture fails CI.
#
# coverage.json is intentionally NOT gated here: coverage numbers are
# environment-dependent (Python version, platform branches) and would drift
# between local dev and CI even with no source change. The emitter still
# runs at site-build time (site/package.json prebuild) so the site always
# shows current coverage; it just isn't diff-gated.
# region:generated-fixtures
generated:
  - doc: site/src/generated/checks.json
    command: jk-standards emit checks
  - doc: site/src/generated/config-schema.json
    command: jk-standards emit config-schema
  - doc: site/src/generated/skills.json
    command: jk-standards emit skills
# endregion:generated-fixtures

# The .mdx reference pages slice source via <CodeSnippet file=… region=… />;
# snippet-regions verifies every such reference resolves to a real
# region:<name> marker in the named file. This repo references regions only
# through CodeSnippet (which names its own file=), so no source_roots are
# declared — prose scanning stays off and every CodeSnippet target is checked.
snippet_regions:
  doc_roots:
    - path: docs
      extensions: [".md"]
    - path: site/src/content/docs
      extensions: [".mdx"]

# The two directed boundaries ARCHITECTURE.md lists as invariants. Dependencies
# flow one way: the CLI and emitters import the check registry, so a check must
# never import back into either — that would invert the dependency and create a
# cycle. Each rule greps every .py under checks/ for the module-path reference;
# a genuinely-necessary crossing is waived in place with `# boundary-ok: <why>`.
# region:boundaries-config
boundaries:
  rules:
    - name: checks-no-cli
      from: src/jk_standards/checks
      extensions: [".py"]
      forbid: 'jk_standards\.cli\b|from jk_standards import [^\n]*\bcli\b'
      hint: "a check must not import the CLI — the CLI depends on checks, not the reverse"
    - name: checks-no-emit
      from: src/jk_standards/checks
      extensions: [".py"]
      forbid: 'jk_standards\.emit\b|from jk_standards import [^\n]*\bemit\b'
      hint: "a check must not import the emitter — emit depends on checks, not the reverse"
# endregion:boundaries-config
# endregion:full-config

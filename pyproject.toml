[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jk-standards"
version = "0.2.0"
description = "Reusable engineering-discipline toolkit: documentation anti-drift checks, pre-commit hooks, reusable CI workflows, and agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Jim Kennedy" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff==0.16.*",
  "coverage[toml]>=7.4",
  "build>=1.2",
  "twine>=5.0",
  "pre-commit>=3.7",
]

[project.scripts]
jk-standards = "jk_standards.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# region:ruff-config
[tool.ruff]
line-length = 100
src = ["src", "tests"]
# endregion:ruff-config

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["jk_standards"]

[tool.coverage.report]
# Coverage floor — bug-fix ratchet. Raise this when the measured number
# drifts up; never lower it. Current gaps: testindex.py (71%),
# generated_freshness.py (72%), file_line_refs.py (79%).
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

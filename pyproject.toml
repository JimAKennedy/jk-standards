[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jk-standards"
version = "0.9.0"
description = "Reusable engineering-discipline toolkit: documentation anti-drift checks, pre-commit hooks, reusable CI workflows, and agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Jim Kennedy" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff==0.16.*",
  "coverage[toml]>=7.4",
  "build>=1.2",
  "twine>=5.0",
  "pre-commit>=3.7",
]
# Optional native grammar for the C++ doc-coverage enumerator. This is the ONLY
# place tree-sitter is declared — the base `dependencies` list stays PyYAML-only
# so `pip install jk-standards` never pulls a native wheel and a C++-free repo
# degrades gracefully (parser import fails → C++ path is a no-op).
cpp = [
  "tree-sitter>=0.23",
  "tree-sitter-cpp>=0.23",
]

[project.scripts]
jk-standards = "jk_standards.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# region:ruff-config
[tool.ruff]
line-length = 100
src = ["src", "tests"]

# Ruff's default selection is E4/E7/E9 + F — syntax errors and pyflakes, little
# more. For a toolkit whose subject is engineering discipline, the rules below
# are the ones that catch a class of defect rather than a style preference:
# bugbear (B) for real bug shapes, import sorting (I) for review-noise-free
# diffs, pyupgrade (UP) so the floor in requires-python is actually used,
# flake8-return (RET) and simplify (SIM) for control flow that reads wrong,
# comprehensions (C4), and pathlib (PTH) since the codebase is Path-based
# throughout and os.path calls are the odd ones out.
[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RET", "PTH"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures embed workflow/config YAML as literals; wrapping them to 100
# columns would obscure the shape under test, which is the point of the fixture.
"tests/*" = ["E501"]
# endregion:ruff-config

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["jk_standards"]

[tool.coverage.report]
# Coverage floor — bug-fix ratchet. Raise this when the measured number
# drifts up; never lower it. Measured 87% at the 0.8.0 release, so the floor
# sits just under it: close enough to catch a real regression, loose enough
# that ordinary refactoring does not trip it.
#
# The weakest module by a wide margin is checks/doc_coverage_cpp.py (12%). It
# is the tree-sitter C++ enumerator, exercised by three synthetic fixtures and
# by the cpp-dogfood CI job, which asserts one golden count against a real
# corpus (poly@v0.1.0-doccov-baseline) — a regression that preserves that count
# passes unseen. Raising it needs unit tests around the enumerator itself, not
# a floor change. Remaining gaps: testindex.py (71%), generated_freshness.py
# (72%), emit.py (74%), file_line_refs.py (79%).
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
